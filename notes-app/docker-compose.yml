services:

  # ── Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: notes-db
    environment:
      POSTGRES_DB:       notesdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend ───────────────────────────────────────
  backend:
    build: ./backend
    container_name: notes-backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     notesdb
      DB_USER:     postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend ──────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: notes-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
